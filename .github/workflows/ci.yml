name: Swap independent SO build and media tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  swap-so:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build SWAP.so using pinned Libraries Common
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Prove native analysis and module formatting
        run: ctest --test-dir build --output-on-failure
      - name: Prove ELF symbols
        run: |
          test -f build/SWAP.so
          nm -D build/SWAP.so | grep -q 'infiltrator_filesystem_api_v2'
          if nm -D build/SWAP.so | grep -Eq 'infiltrator_filesystem_.*_v1|infiltrator_filesystem_api_v1'; then
            echo "Retired filesystem export remains" >&2
            exit 1
          fi
      - name: Direct install has exactly one SWAP.so and its current manual
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          DESTDIR="$stage" cmake --install build
          test "$(find "$stage" -type f | wc -l)" -eq 2
          test -s "$stage/System/Filesystems/SWAP.so"
          test -s "$stage/System/Resources/Documentation/Filesystem-Swap.pdf"
          test "$(head -c 5 "$stage/System/Resources/Documentation/Filesystem-Swap.pdf")" = '%PDF-'
          cmp build/Filesystem-Swap.pdf "$stage/System/Resources/Documentation/Filesystem-Swap.pdf"
      - uses: actions/upload-artifact@v4
        with:
          name: SWAP-so
          path: build/SWAP.so
